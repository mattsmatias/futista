<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ei verkkoyhteyttä – Futista</title>
<style>
  :root { --bg: #f3f4f7; --fg: #0b0e14; --muted: #5d6676; --card: #fff; --line: #e3e6ec; }
  @media (prefers-color-scheme: dark) { :root { --bg: #07090d; --fg: #f2f5f9; --muted: #8b95a7; --card: #11151c; --line: #1a1f28; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 16px; }
  ul { list-style: none; padding: 0; margin: 16px 0; display: grid; gap: 8px; }
  a { display: block; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; overflow-wrap: anywhere; }
  button { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--fg); color: var(--bg); font: 700 15px/1 system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1 id="t">Ei verkkoyhteyttä</h1>
  <p id="d">Tätä sivua ei ole tallennettu laitteellesi. Tiedot eivät päivity ilman verkkoyhteyttä.</p>
  <button id="r" type="button" onclick="location.reload()">Yritä uudelleen</button>
  <p id="s" style="margin-top:24px">Tallennetut sivut (voivat olla vanhentuneita):</p>
  <ul id="l"></ul>
</main>
<script>
  // kieli samasta asetuksesta kuin sivustolla
  var L = { sv: ["Ingen nätanslutning", "Sidan har inte sparats på din enhet. Uppgifterna uppdateras inte utan nätanslutning.", "Försök igen", "Sparade sidor (kan vara inaktuella):", "Startsidan"],
            en: ["No connection", "This page hasn't been saved on your device. Data does not update without a connection.", "Try again", "Saved pages (may be out of date):", "Home"] };
  var lang = "fi"; try { lang = localStorage.getItem("futista-kieli") || "fi"; } catch (e) {}
  var x = L[lang]; if (x) { document.documentElement.lang = lang; document.getElementById("t").textContent = x[0]; document.getElementById("d").textContent = x[1]; document.getElementById("r").textContent = x[2]; document.getElementById("s").textContent = x[3]; }
  if (window.caches) caches.open("futista-pages-v6").then(function (c) { return c.keys(); }).then(function (keys) {
    var ul = document.getElementById("l");
    if (!keys.length) { document.getElementById("s").style.display = "none"; return; }
    keys.slice(-15).reverse().forEach(function (k) {
      var u = new URL(k.url); var a = document.createElement("a"); a.href = u.pathname + u.search;
      a.textContent = u.pathname === "/" ? (x ? x[4] : "Etusivu") : decodeURIComponent(u.pathname).replace(/^\//, "").replace(/-/g, " ");
      var li = document.createElement("li"); li.appendChild(a); ul.appendChild(li);
    });
  });
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
